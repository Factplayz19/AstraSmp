name: Build AstraSMP

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract Project ZIP
        run: |
          mkdir extracted
          unzip -q AstraSMP-1.0.0-Paper-1.21.11.zip -d extracted

      - name: Find Maven Project
        run: |
          POM=$(find extracted -name pom.xml -type f | head -n 1)
          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml not found!"
            exit 1
          fi
          echo "Found: $POM"
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build Plugin
        run: |
          cd "$PROJECT_DIR"
          mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstraSMP-JAR
          path: '${{ env.PROJECT_DIR }}/target/*.jar'
